name: Shellcheck

on:
  push:
    branches: [main]
    paths: ['scripts/**/*.sh']
  pull_request:
    paths: ['scripts/**/*.sh']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Check shell scripts
        run: find scripts -name '*.sh' -type f -print0 | xargs -0 shellcheck --severity=warning
